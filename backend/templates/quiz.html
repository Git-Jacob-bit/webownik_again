<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tryb Nauki</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .answer-btn { 
            cursor: pointer; 
            transition: 0.2s; 
            text-align: left; 
            border: 2px solid #dee2e6; /* Grubsza ramka */
        }
        .answer-btn:hover { background-color: #f8f9fa; border-color: #adb5bd; }
        
        /* Styl zaznaczonego elementu (przed sprawdzeniem) */
        .selected { 
            background-color: #e7f1ff !important; 
            border-color: #0d6efd !important; 
            color: #0d6efd;
            font-weight: 500;
        }

        /* Style po sprawdzeniu */
        .correct-answer { 
            background-color: #d1e7dd !important; 
            border-color: #198754 !important; 
            color: #0f5132 !important;
        }
        .wrong-answer { 
            background-color: #f8d7da !important; 
            border-color: #dc3545 !important; 
            color: #842029 !important;
        }
        /* Styl dla odpowiedzi poprawnej, której NIE zaznaczyliśmy (podpowiedź) */
        .missed-answer {
            border: 2px dashed #198754 !important;
            opacity: 0.7;
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <a href="/" class="btn btn-outline-secondary mb-4">&larr; Wróć do menu</a>

    <div class="row justify-content-center">
        <div class="col-md-8">
            
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <span id="deck-title">Ładowanie...</span>
                    <span id="progress-text" class="badge bg-light text-dark">0/0</span>
                </div>
                <div class="card-body p-5">
                    
                    <div class="mb-2">
                        <span id="question-type-badge" class="badge bg-secondary">Jednokrotny wybór</span>
                    </div>

                    <h3 class="card-title mb-4" id="question-content">...</h3>

                    <div class="d-grid gap-3" id="answers-container"></div>

                    <div class="mt-4 d-flex justify-content-end gap-2">
                        <button id="check-btn" class="btn btn-success btn-lg" onclick="submitAnswer()">Sprawdź</button>
                        <button id="next-btn" class="btn btn-primary btn-lg d-none" onclick="showNextQuestion()">Dalej &rarr;</button>
                    </div>
                    
                    <div id="result-message" class="mt-3 text-end fw-bold"></div>

                </div>
            </div>

        </div>
    </div>
</div>

<script>
    const pathParts = window.location.pathname.split('/');
    const deckId = pathParts[pathParts.length - 1];

    let allQuestions = [];
    let currentQuestionIndex = 0;
    let currentQuestionData = null;

    async function loadQuestions() {
        try {
            const response = await fetch(`/decks/${deckId}/questions`);
            if (!response.ok) throw new Error("Błąd sieci");
            allQuestions = await response.json();
            
            if (allQuestions.length > 0) {
                document.getElementById('deck-title').innerText = `Zestaw #${deckId}`;
                showNextQuestion(true);
            } else {
                document.getElementById('question-content').innerText = "Zestaw jest pusty.";
                document.getElementById('check-btn').classList.add('d-none');
            }
        } catch (error) {
            console.error(error);
            document.getElementById('question-content').innerText = "Błąd pobierania pytań.";
        }
    }

    function showNextQuestion(isFirst = false) {
        if (!isFirst) currentQuestionIndex++;

        if (currentQuestionIndex >= allQuestions.length) {
            finishQuiz();
            return;
        }

        currentQuestionData = allQuestions[currentQuestionIndex];
        
        // Reset UI
        document.getElementById('check-btn').classList.remove('d-none'); // Pokaż "Sprawdź"
        document.getElementById('check-btn').disabled = false;
        document.getElementById('next-btn').classList.add('d-none');     // Ukryj "Dalej"
        document.getElementById('result-message').innerText = "";
        
        document.getElementById('progress-text').innerText = `Pytanie ${currentQuestionIndex + 1}/${allQuestions.length}`;
        document.getElementById('question-content').innerText = currentQuestionData.content;

        // Sprawdź ile jest poprawnych odpowiedzi, żeby dać hint użytkownikowi
        const correctCount = currentQuestionData.answers.filter(a => a.is_correct).length;
        const badge = document.getElementById('question-type-badge');
        if (correctCount > 1) {
            badge.innerText = `Wielokrotny wybór (${correctCount} poprawne)`;
            badge.className = "badge bg-warning text-dark";
        } else {
            badge.innerText = "Jednokrotny wybór";
            badge.className = "badge bg-info text-dark";
        }

        renderAnswers(currentQuestionData.answers);
    }

    function renderAnswers(answers) {
        const container = document.getElementById('answers-container');
        container.innerHTML = '';

        answers.forEach((ans, index) => {
            const btn = document.createElement('div');
            btn.className = 'card p-3 answer-btn';
            btn.innerText = ans.content;
            btn.dataset.index = index; // Zapisujemy index żeby potem łatwo znaleźć
            
            // Obsługa zaznaczania (toggle)
            btn.onclick = () => {
                // Jeśli quiz już sprawdzony, zablokuj klikanie
                if (document.getElementById('check-btn').classList.contains('d-none')) return;
                
                btn.classList.toggle('selected');
            };
            
            container.appendChild(btn);
        });
    }

    function submitAnswer() {
        const container = document.getElementById('answers-container');
        const buttons = container.children;
        let allCorrect = true;
        let selectedCount = 0;

        // Iterujemy po wszystkich przyciskach i sprawdzamy
        for (let i = 0; i < buttons.length; i++) {
            const btn = buttons[i];
            const isSelected = btn.classList.contains('selected');
            const data = currentQuestionData.answers[i]; // Bierzemy dane odpowiedzi (z pamięci)
            
            if (isSelected) selectedCount++;

            // Logika kolorowania
            if (isSelected && data.is_correct) {
                // Zaznaczył dobrze -> Zielony
                btn.classList.add('correct-answer');
                btn.innerHTML += ' ✅';
            } else if (isSelected && !data.is_correct) {
                // Zaznaczył źle -> Czerwony
                btn.classList.add('wrong-answer');
                btn.innerHTML += ' ❌';
                allCorrect = false;
            } else if (!isSelected && data.is_correct) {
                // Nie zaznaczył, a powinien -> Ramka przerywana
                btn.classList.add('missed-answer');
                allCorrect = false;
            }
            
            // Usuń klasę 'selected', żeby nie myliła po sprawdzeniu
            btn.classList.remove('selected');
            btn.style.cursor = "default";
        }

        if (selectedCount === 0) {
            alert("Zaznacz przynajmniej jedną odpowiedź!");
            return; // Przerywamy sprawdzanie
        }

        // Pokaż wynik tekstowy
        const msgDiv = document.getElementById('result-message');
        if (allCorrect) {
            msgDiv.innerText = "Brawo! Wszystko dobrze.";
            msgDiv.className = "mt-3 text-end fw-bold text-success";
        } else {
            msgDiv.innerText = "Niestety, błąd.";
            msgDiv.className = "mt-3 text-end fw-bold text-danger";
        }

        // Przełącz przyciski
        document.getElementById('check-btn').classList.add('d-none');
        document.getElementById('next-btn').classList.remove('d-none');
    }

    function finishQuiz() {
        document.getElementById('question-content').innerText = "Koniec zestawu!";
        document.getElementById('answers-container').innerHTML = `
            <div class="text-center py-4">
                <h4>Gratulacje! Przerobiłeś cały materiał.</h4>
                <div class="mt-4">
                    <a href="/" class="btn btn-success">Wróć do menu</a>
                    <button onclick="location.reload()" class="btn btn-outline-primary">Powtórz</button>
                </div>
            </div>
        `;
        document.getElementById('check-btn').classList.add('d-none');
        document.getElementById('next-btn').classList.add('d-none');
        document.getElementById('question-type-badge').classList.add('d-none');
        document.getElementById('result-message').innerText = "";
    }

    loadQuestions();
</script>

</body>
</html>
