<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Webownik</title>
    <script src="/static/js/guard.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .quiz-container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .answer-btn { width: 100%; margin-bottom: 10px; text-align: left; padding: 15px; font-size: 1.1rem; border: 2px solid #dee2e6; transition: all 0.2s; background: white;}
        .answer-btn:hover:not(:disabled) { background-color: #e9ecef; border-color: #adb5bd; }
        .selected { border-color: #0d6efd !important; background-color: #cfe2ff !important; color: #084298; position: relative; }
        .selected::after { content: ' ✔'; float: right; font-weight: bold; }
        .result-correct { background-color: #d4edda !important; border-color: #28a745 !important; color: #155724; }
        .result-wrong { background-color: #f8d7da !important; border-color: #dc3545 !important; color: #721c24; text-decoration: line-through; }
        .result-missed { background-color: #fff3cd !important; border-color: #ffc107 !important; color: #856404; border-width: 3px !important; }
        .result-missed::after { content: ' (To też poprawne!)'; font-size: 0.8rem; opacity: 0.8; }
        .hidden { display: none !important; }
        .action-btn { margin-top: 20px; font-weight: bold; height: 50px;}
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .progress-badge { font-size: 0.9rem; color: #6c757d; font-weight: bold; }
        
        /* Stylizacja Zegara i Pauzy */
        .timer-box { font-family: 'Courier New', monospace; font-weight: bold; font-size: 1.2rem; color: #0d6efd; display: flex; align-items: center; gap: 10px; }
        .pause-btn { cursor: pointer; border: none; background: none; color: #ffc107; font-size: 1.2rem; transition: transform 0.2s; }
        .pause-btn:hover { transform: scale(1.2); color: #e0a800; }
        
        /* Overlay Pauzy */
        #pause-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Webownik</a>
    </div>
</nav>

<div class="container">
    <div class="quiz-container">
        
        <div class="quiz-header">
            <div>
                <span class="badge bg-primary me-2">Quiz</span>
                <span id="progress-text" class="progress-badge">Ładowanie...</span>
            </div>
            
            <div class="timer-box hidden" id="timer-container">
                <span id="timer">00:00</span>
                <button class="pause-btn" onclick="togglePause()" title="Pauza">⏸</button>
            </div>

            <a href="/" class="btn btn-outline-danger btn-sm">&times; Wyjście</a>
        </div>
        
        <div id="start-screen" class="text-center mt-4">
            <h2 class="mb-3">Gotowy do nauki?</h2>
            <p class="lead text-muted">Zestaw: <span id="deck-title">...</span></p>
            <div id="resume-section" class="hidden mb-4">
                <div class="alert alert-info">Masz niedokończoną sesję!</div>
                <button onclick="startQuiz(false)" class="btn btn-primary btn-lg w-100 mb-2">Kontynuuj naukę</button>
            </div>
            <button onclick="startQuiz(true)" class="btn btn-outline-dark btn-lg w-100">Rozpocznij od nowa</button>
        </div>

        <div id="pause-overlay" class="hidden">
            <h2 class="text-muted mb-3">Pauza ☕</h2>
            <p>Czas został zatrzymany.</p>
            <button class="btn btn-primary btn-lg" onclick="togglePause()">▶ Wznów naukę</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <h3 id="question-text" class="mb-4 mt-2">...</h3>
            <p class="text-muted small">Zaznacz wszystkie poprawne odpowiedzi:</p>
            <div id="answers-area"></div>
            <div id="action-area">
                <button id="confirm-btn" class="btn btn-primary w-100 btn-lg action-btn" disabled onclick="confirmSelection()">Zatwierdź odpowiedź</button>
                <button id="next-btn" class="btn btn-secondary w-100 btn-lg action-btn hidden" onclick="loadNextQuestion()">Następne pytanie &rarr;</button>
            </div>
            <p id="feedback-msg" class="text-center mt-3 text-muted hidden">...</p>
        </div>

        <div id="end-screen" class="hidden text-center mt-4">
            <h1 class="display-4 text-success">Gratulacje!</h1>
            <p class="lead">Przerobiłeś cały materiał.</p>
            <p>Twój czas nauki: <strong id="final-time">00:00</strong></p>
            <hr>
            <a href="/" class="btn btn-primary btn-lg w-100 mb-3">Wróć do zestawów</a>
            <button onclick="location.reload()" class="btn btn-outline-secondary btn-lg w-100">Powtórz jeszcze raz</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');
    const pathParts = window.location.pathname.split('/');
    const deckId = pathParts[pathParts.length - 1];
    let selectedAnswerIds = new Set();
    
    // Zmienne zegara
    let totalSeconds = 0;
    let timerInterval;
    let isPaused = false;

    // --- LOGIKA ZEGARA ---
    function startTimer() {
        stopTimer(); // Czyścimy stary interwał
        timerInterval = setInterval(() => {
            if (!isPaused) {
                totalSeconds++;
                updateTimerDisplay();
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    function updateTimerDisplay() {
        let m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
        let s = (totalSeconds % 60).toString().padStart(2, '0');
        document.getElementById('timer').innerText = `${m}:${s}`;
        document.getElementById('final-time').innerText = `${m}:${s}`;
    }

    async function togglePause() {
        const overlay = document.getElementById('pause-overlay');
        
        if (!isPaused) {
            // Włączamy pauzę
            await fetch(`/quiz/pause/${deckId}`, { method: 'POST', headers: {'Authorization': `Bearer ${token}`} });
            isPaused = true;
            stopTimer();
            overlay.classList.remove('hidden');
        } else {
            // Wznawiamy
            await fetch(`/quiz/resume/${deckId}`, { method: 'POST', headers: {'Authorization': `Bearer ${token}`} });
            isPaused = false;
            startTimer();
            overlay.classList.add('hidden');
        }
    }

    // --- LOGIKA QUIZU ---

    async function init() {
        const response = await fetch(`/quiz/status/${deckId}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await response.json();
        
        document.getElementById('deck-title').innerText = `Zestaw #${deckId}`;
        
        if (data.has_active_session) {
            document.getElementById('resume-section').classList.remove('hidden');
            document.getElementById('progress-text').innerText = "W toku (" + data.remaining + ")";
            // Wczytaj czas z bazy
            totalSeconds = data.time_spent || 0;
            updateTimerDisplay();
        } else {
            document.getElementById('progress-text').innerText = "Nowa gra";
        }
    }

    async function startQuiz(forceNew) {
        const res = await fetch(`/quiz/start/${deckId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({force_new: forceNew})
        });
        
        const data = await res.json(); // Pobieramy odpowiedź

        if (res.ok) {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('timer-container').classList.remove('hidden'); // Pokaż zegar
            
            // Ustaw czas początkowy (dla kontynuacji lub nowej gry)
            totalSeconds = data.time_spent || 0;
            updateTimerDisplay();
            startTimer(); // Start zegara

            loadNextQuestion();
        }
    }

    async function loadNextQuestion() {
        selectedAnswerIds.clear();
        document.getElementById('confirm-btn').classList.remove('hidden');
        document.getElementById('confirm-btn').disabled = true;
        document.getElementById('next-btn').classList.add('hidden');
        document.getElementById('feedback-msg').classList.add('hidden');

        const res = await fetch(`/quiz/next/${deckId}`, {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await res.json();

        if (data.finished) {
            showEndScreen();
            return;
        }

        document.getElementById('progress-text').innerText = `Zostało: ${data.remaining}`;
        document.getElementById('question-text').innerText = data.question.content;
        const answersArea = document.getElementById('answers-area');
        answersArea.innerHTML = ''; 

        data.question.answers.forEach(ans => {
            const btn = document.createElement('button');
            btn.className = 'btn answer-btn';
            btn.innerText = ans.content;
            btn.dataset.id = ans.id; 
            btn.onclick = () => toggleAnswer(ans.id, btn);
            answersArea.appendChild(btn);
        });
    }

    async function confirmSelection() {
        stopTimer(); // Zatrzymujemy wizualnie na moment sprawdzania

        const res = await fetch(`/quiz/answer/${deckId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({answer_ids: Array.from(selectedAnswerIds)})
        });
        const result = await res.json();
        
        // Synchronizacja czasu z serwerem
        if(result.time_spent !== undefined) {
            totalSeconds = result.time_spent;
            updateTimerDisplay();
        }
        startTimer(); // Wznawiamy zegar

        const correctIds = new Set(result.correct_ids);

        document.querySelectorAll('.answer-btn').forEach(btn => {
            const btnId = parseInt(btn.dataset.id);
            const isActuallyCorrect = correctIds.has(btnId);
            const wasSelected = selectedAnswerIds.has(btnId);

            btn.disabled = true;
            btn.classList.remove('selected'); 
            if (wasSelected && isActuallyCorrect) btn.classList.add('result-correct');
            else if (wasSelected && !isActuallyCorrect) btn.classList.add('result-wrong');
            else if (!wasSelected && isActuallyCorrect) btn.classList.add('result-missed');
        });

        const feedback = document.getElementById('feedback-msg');
        feedback.classList.remove('hidden');
        feedback.innerText = result.is_correct ? "Dobrze!" : "Błąd, powtórzymy to.";
        feedback.className = `text-center mt-3 fw-bold ${result.is_correct ? 'text-success' : 'text-danger'}`;

        document.getElementById('confirm-btn').classList.add('hidden');
        const nextBtn = document.getElementById('next-btn');
        nextBtn.classList.remove('hidden');

        if (result.finished) {
            nextBtn.innerHTML = "Zakończ i idź na piwo! 🍺";
            nextBtn.classList.replace('btn-secondary', 'btn-success'); 
            nextBtn.onclick = () => showEndScreen(); 
        } else {
            nextBtn.innerHTML = "Następne pytanie &rarr;";
            nextBtn.onclick = () => loadNextQuestion();
        }
    }
    
    function toggleAnswer(answerId, btn) {
        if (!document.getElementById('next-btn').classList.contains('hidden')) return;
        if (selectedAnswerIds.has(answerId)) {
            selectedAnswerIds.delete(answerId);
            btn.classList.remove('selected');
        } else {
            selectedAnswerIds.add(answerId);
            btn.classList.add('selected');
        }
        document.getElementById('confirm-btn').disabled = (selectedAnswerIds.size === 0);
    }

    function showEndScreen() {
        stopTimer(); // Zatrzymaj zegar ostatecznie
        document.getElementById('quiz-screen').classList.add('hidden');
        document.getElementById('timer-container').classList.add('hidden'); // Ukryj mały zegar
        document.getElementById('end-screen').classList.remove('hidden');
    }

    init();
</script>
</body>
</html>
