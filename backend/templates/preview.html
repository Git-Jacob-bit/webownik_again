<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edycja: {{ deck.title }}</title>
    <script src="/static/js/guard.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; padding: 30px 0; font-family: sans-serif; }
        .question-block { background: white; padding: 25px; border-radius: 12px; margin-bottom: 25px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #e9ecef; }
        .view-mode .edit-section { display: none; }
        .edit-mode .view-section { display: none; }
        .edit-mode { border-color: #0d6efd; box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.1); }
        .is-correct-view { background-color: #d1e7dd; color: #0f5132; font-weight: bold; border-radius: 4px; padding: 5px 10px; }
        .ans-row { margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container" style="max-width: 850px;">
    <div class="d-flex justify-content-between mb-4 border-bottom pb-3">
        <h3>{{ deck.title }}</h3>
        <a href="/" class="btn btn-outline-dark btn-sm">Powrót</a>
    </div>

    <div id="questions-list">
        {% for question in questions %}
        <div class="question-block view-mode" id="q-card-{{ question.id }}">

            <div class="view-section">
                <div class="d-flex justify-content-between mb-3">
                    <h5 class="mb-0 text-dark">#{{ loop.index }} {{ question.content }}</h5>
                    <button onclick="toggleEdit({{ question.id }})" class="btn btn-sm btn-primary">Edytuj</button>
                </div>
                <div>
                    {% for answer in question.answers %}
                    <div class="ans-row {% if answer.is_correct %}is-correct-view{% endif %}">
                        {{ answer.content }}
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="edit-section">
                <div class="mb-3">
                    <label class="form-label fw-bold">Pytanie</label>
                    <input type="text" class="form-control q-content-input" 
                           value="{{ question.content }}" autocomplete="off">
                </div>

                <div class="ans-container mb-3">
                    {% for answer in question.answers %}
                    <div class="input-group mb-2 ans-edit-row" data-ans-id="{{ answer.id }}">
                        <div class="input-group-text">
                            <input class="form-check-input mt-0 ans-correct-input" type="checkbox" 
                                   {% if answer.is_correct %}checked{% endif %}>
                        </div>
                        <input type="text" class="form-control ans-content-input" 
                               value="{{ answer.content }}" autocomplete="off">
                    </div>
                    {% endfor %}
                </div>

                <div class="d-flex gap-2">
                    <button onclick="saveQuestion({{ question.id }})" class="btn btn-success">Zapisz</button>
                    <button onclick="cancelEdit({{ question.id }})" class="btn btn-secondary">Anuluj</button>
                    <button onclick="deleteQuestion({{ question.id }})" class="btn btn-outline-danger ms-auto">Usuń</button>
                </div>
            </div>

        </div>
        {% endfor %}
    </div>
    
    <div class="text-center mt-5">
        <button onclick="addNewQuestion()" class="btn btn-lg btn-primary shadow-sm">Dodaj nowe pytanie</button>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');

    function toggleEdit(id) {
        document.getElementById(`q-card-${id}`).className = 'question-block edit-mode';
    }

    function cancelEdit(id) {
        // Twardy reload, żeby wyczyścić śmieci z formularzy
        window.location.reload();
    }

    async function saveQuestion(qId) {
        const card = document.getElementById(`q-card-${qId}`);
        const content = card.querySelector('.q-content-input').value;
        
        // Pobieramy odpowiedzi
        const answers = Array.from(card.querySelectorAll('.ans-edit-row')).map(row => ({
            id: parseInt(row.getAttribute('data-ans-id')),
            content: row.querySelector('.ans-content-input').value,
            is_correct: row.querySelector('.ans-correct-input').checked
        }));

        try {
            const res = await fetch(`/decks/question/${qId}/full`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ content, answers })
            });

            if (res.ok) {
                // DODAJEMY LOSOWY PARAMETR CZASU, ŻEBY WYMUSIĆ ODŚWIEŻENIE CACHE'U
                window.location.href = window.location.pathname + '?t=' + new Date().getTime();
            } else {
                alert("Błąd zapisu.");
            }
        } catch (e) {
            alert("Błąd połączenia.");
        }
    }

    async function deleteQuestion(id) {
        if(!confirm("Usunąć?")) return;
        await fetch(`/decks/question/${id}`, { 
            method: 'DELETE', 
            headers: {'Authorization': `Bearer ${token}`} 
        });
        window.location.reload();
    }

    async function addNewQuestion() {
        const content = prompt("Treść pytania:");
        if(!content) return;
        
        await fetch(`/decks/{{ deck.id }}/question`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ content })
        });
        window.location.reload();
    }
</script>

</body>
</html>
