<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Webownik - Logowanie i Rejestracja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-card { width: 100%; max-width: 400px; display: none; }
        .auth-card.active { display: block; }
    </style>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div id="login-card" class="card p-4 shadow auth-card active">
        <h3 class="text-center mb-4">Zaloguj się</h3>
        <form onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Hasło</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Wejdź</button>
        </form>
        <div class="mt-3 text-center">
            <span>Nie masz konta? </span>
            <a href="#" onclick="toggleForm('register-card')">Zarejestruj się</a>
        </div>
        <div id="login-error" class="text-danger mt-3 text-center"></div>
    </div>

    <div id="register-card" class="card p-4 shadow auth-card">
        <h3 class="text-center mb-4">Stwórz konto</h3>
        <form onsubmit="handleRegister(event)">
            <div class="mb-3">
                <label class="form-label">Adres Email</label>
                <input type="email" name="reg_email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Hasło</label>
                <input type="password" name="reg_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Zarejestruj</button>
        </form>
        <div class="mt-3 text-center">
            <span>Masz już konto? </span>
            <a href="#" onclick="toggleForm('login-card')">Zaloguj się</a>
        </div>
        <div id="register-msg" class="mt-3 text-center"></div>
    </div>

<script>
    // Przełączanie między logowaniem a rejestracją
    function toggleForm(cardId) {
        document.querySelectorAll('.auth-card').forEach(card => card.classList.remove('active'));
        document.getElementById(cardId).classList.add('active');
        document.getElementById('login-error').innerText = '';
        document.getElementById('register-msg').innerText = '';
    }

    // LOGOWANIE
    async function handleLogin(event) {
        event.preventDefault();
        const formData = new FormData(event.target);
        const params = new URLSearchParams();
        params.append('username', formData.get('username'));
        params.append('password', formData.get('password'));

        try {
            const response = await fetch('/auth/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                window.location.href = '/';
            } else {
                document.getElementById('login-error').innerText = "Błędny email lub hasło";
            }
        } catch (err) {
            document.getElementById('login-error').innerText = "Błąd połączenia z serwerem";
        }
    }

    // REJESTRACJA
    async function handleRegister(event) {
        event.preventDefault();
        const formData = new FormData(event.target);
        const email = formData.get('reg_email');
        const password = formData.get('reg_password');

        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: email,
                    hashed_password: password // Twój backend w register_user używa tego pola do hashowania
                })
            });

            const result = await response.json();

            if (response.ok) {
                const msg = document.getElementById('register-msg');
                msg.className = "text-success mt-3 text-center";
                msg.innerText = "Konto utworzone! Możesz się zalogować.";
                event.target.reset();
            } else {
                const msg = document.getElementById('register-msg');
                msg.className = "text-danger mt-3 text-center";
                msg.innerText = result.detail || "Błąd rejestracji";
            }
        } catch (err) {
            console.error(err);
        }
    }
</script>

</body>
</html>
