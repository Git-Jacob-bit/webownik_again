<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webownik - Wybierz Zestaw</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">🧠 Webownik</h1>
        <p class="lead text-muted">Wybierz zestaw i zacznij naukę</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="list-group shadow-sm">
                {% for deck in decks %}
                <a href="/nauka/{{ deck.id }}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-4">
                    <div>
                        <h5 class="mb-1">{{ deck.title }}</h5>
                        <small class="text-muted">ID zestawu: {{ deck.id }}</small>
                    </div>
                    <span class="badge bg-primary rounded-pill">Rozpocznij &rarr;</span>
                </a>
                {% else %}
                <div class="alert alert-warning text-center">
                    Brak zestawów. Użyj Swaggera, aby wgrać plik .txt!
                </div>
                {% endfor %}
            </div>

            <div class="card p-4 shadow-sm">
                <h4>Wgraj nowy zestaw (z folderu)</h4>
                <form action="/decks/upload-form" method="post" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label">Nazwa zestawu:</label>
                        <input type="text" name="deck_name" class="form-control" placeholder="np. Egzamin E.14" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Zaznacz pliki z pytaniami (możesz wybrać wiele):</label>
                        <input type="file" name="files" class="form-control" multiple required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Stwórz zestaw z plików</button>
                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
