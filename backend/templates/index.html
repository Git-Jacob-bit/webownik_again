<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Webownik - Moje Zestawy</title>
    <script src="/static/js/guard.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Twoje Zestawy 📚</h1>
        
        <div class="d-flex align-items-center gap-2">
            <a href="/settings" class="btn btn-light text-secondary border-0" title="Ustawienia Konta">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-gear-fill" viewBox="0 0 16 16">
                    <path d="M9.405 1.05c-.413-1.4-2.397-1.4-2.81 0l-.1.34a1.464 1.464 0 0 1-2.105.872l-.31-.17c-1.283-.698-2.686.705-1.987 1.987l.169.311c.446.82.023 1.841-.872 2.105l-.34.1c-1.4.413-1.4 2.397 0 2.81l.34.1a1.464 1.464 0 0 1 .872 2.105l-.17.31c-.698 1.283.705 2.686 1.987 1.987l.311-.169a1.464 1.464 0 0 1 2.105.872l.1.34c.413 1.4 2.397 1.4 2.81 0l.1-.34a1.464 1.464 0 0 1 2.105-.872l.31.17c1.283.698 2.686-.705 1.987-1.987l-.169-.311a1.464 1.464 0 0 1 .872-2.105l.34-.1c1.4-.413 1.4-2.397 0-2.81l-.34-.1a1.464 1.464 0 0 1-.872-2.105l.17-.31c.698-1.283-.705-2.686-1.987-1.987l-.311.169a1.464 1.464 0 0 1-2.105-.872l-.1-.34zM8 10.93a2.929 2.929 0 1 1 0-5.86 2.929 2.929 0 0 1 0 5.858z"/>
                </svg>
            </a>
            
            <button onclick="logout()" class="btn btn-outline-danger">Wyloguj</button>
        </div>
    </div>

    <div class="card p-4 mb-4 shadow-sm">
        <h5>Dodaj nowy zestaw</h5>
        <form id="upload-form" onsubmit="handleUpload(event)">
            <div class="mb-3">
                <input type="text" name="deck_name" class="form-control" placeholder="Nazwa zestawu (np. Anatomia)" required>
            </div>
            <div class="mb-3">
                <input type="file" name="files" multiple class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Wgraj pliki i stwórz zestaw</button>
        </form>
    </div>

    <div id="decks-container" class="row">
        <p class="text-center text-muted">Ładowanie Twoich zestawów...</p>
    </div>
</div>

<script>
    const token = localStorage.getItem('token');

    // 1. Pobieranie zestawów
    async function loadDecks() {
        try {
            const response = await fetch('/decks/mine', {
                headers: { 
                    'Authorization': 'Bearer ' + token 
                }
            });

            if (response.status === 401) { logout(); return; }

            const decks = await response.json();
            const container = document.getElementById('decks-container');
            container.innerHTML = '';

            if (decks.length === 0) {
                container.innerHTML = '<div class="col-12 text-center"><p class="text-muted">Nie masz jeszcze żadnych zestawów. Wgraj pliki powyżej!</p></div>';
                return;
            }

            decks.forEach(deck => {
                const html = `
                    <div class="col-md-4 mb-3" id="deck-card-${deck.id}">
                        <div class="card h-100 shadow-sm">
                            <div class="card-body">
                                <h5 class="card-title">${deck.title}</h5>
                                <p class="card-text text-muted small">ID: ${deck.id}</p>
                                <div class="d-flex justify-content-between mt-3">
                                    <button onclick="deleteDeck(${deck.id})" class="btn btn-sm btn-outline-danger">Usuń</button>
                                    <div>
                                        <a href="/preview/${deck.id}" class="btn btn-sm btn-outline-secondary">Podgląd</a>
                                        <a href="/quiz/${deck.id}" class="btn btn-sm btn-primary">Ucz się</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        } catch (error) {
            console.error("Błąd ładowania:", error);
        }
    }

    // 2. Obsługa Uploadu
    async function handleUpload(event) {
        event.preventDefault();
        const form = event.target;
        const formData = new FormData(form);
        
        try {
            const response = await fetch('/decks/upload-form', {
                method: 'POST',
                headers: {
                    'Authorization': 'Bearer ' + token
                },
                body: formData
            });

            if (response.ok) {
                alert('Zestaw został utworzony pomyślnie!');
                form.reset();
                loadDecks(); // Odśwież listę
            } else {
                const err = await response.json();
                alert('Błąd: ' + (err.detail || 'Nie udało się wgrać plików.'));
            }
        } catch (error) {
            alert('Wystąpił błąd połączenia.');
        }
    }

    // 3. USUWANIE ZESTAWU
    async function deleteDeck(id) {
        if(!confirm("Czy na pewno chcesz usunąć ten zestaw wraz ze wszystkimi pytaniami?")) return;
        
        try {
            const response = await fetch(`/decks/${id}`, {
                method: 'DELETE',
                headers: { 
                    'Authorization': 'Bearer ' + token 
                }
            });

            if (response.ok) {
                const card = document.getElementById(`deck-card-${id}`);
                if (card) card.remove();
                loadDecks();
            } else {
                const err = await response.json();
                alert('Błąd usuwania: ' + (err.detail || 'Brak uprawnień.'));
            }
        } catch (error) {
            console.error("Błąd podczas usuwania:", error);
            alert('Wystąpił błąd podczas próby usunięcia zestawu.');
        }
    }

    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/login';
    }

    loadDecks();
</script>
</body>
</html>
