<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Ustawienia - Webownik</title>
    <script src="/static/js/guard.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Webownik</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="card-title mb-4">Ustawienia konta ⚙️</h3>
                    
                    <form onsubmit="handleChangePassword(event)">
                        <div class="mb-3">
                            <label class="form-label">Obecne hasło</label>
                            <input type="password" name="old_password" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Nowe hasło</label>
                            <input type="password" name="new_password" class="form-control" minlength="4" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Zmień hasło</button>
                            <a href="/" class="btn btn-outline-secondary">Anuluj i wróć</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    async function handleChangePassword(event) {
        event.preventDefault();
        const token = localStorage.getItem('token');
        const formData = new FormData(event.target);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch('/auth/change-password', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                alert("Hasło zostało zmienione pomyślnie!");
                window.location.href = "/";
            } else {
                const err = await response.json();
                alert("Błąd: " + (err.detail || "Nie udało się zmienić hasła."));
            }
        } catch (error) {
            console.error(error);
            alert("Wystąpił błąd połączenia.");
        }
    }
</script>

</body>
</html>
