name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Lockfile matches requirements.txt
        run: |
          grep -v '^argostranslate==' requirements.txt > /tmp/req.in
          uv pip compile /tmp/req.in --python-version 3.11 --python-platform x86_64-manylinux_2_28 \
            --generate-hashes --no-annotate --no-header -o /tmp/requirements.lock
          diff <(grep -v '^#' requirements.lock) /tmp/requirements.lock
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt pip-audit
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --strict -r requirements.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Zależności wyłącznie budujące (Tailwind 3) mają udokumentowany wyjątek w docs/security-audit-exceptions.md.
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t webownik-api ./backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.prod -t webownik-web ./frontend
      - name: Validate nginx config
        run: |
          docker run --rm --add-host webownik-api:127.0.0.1 --add-host kong:127.0.0.1 \
            webownik-web nginx -t
