name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: requirements.txt matches requirements.in
        run: python tools/check_requirements.py
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install -r requirements-dev.txt pip-audit
      - name: Tests
        run: pytest -q
      - name: Dependency audit
        run: pip-audit --strict -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Zależności wyłącznie budujące (Tailwind 3) mają udokumentowany wyjątek w docs/security-audit-exceptions.md.
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t webownik-api ./backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile.prod -t webownik-web ./frontend
      - name: Validate nginx config
        run: |
          docker run --rm --add-host webownik-api:127.0.0.1 --add-host kong:127.0.0.1 \
            webownik-web nginx -t
