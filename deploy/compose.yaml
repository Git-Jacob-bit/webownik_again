# Webownik — TrueNAS SCALE: Apps → Discover Apps → ⋮ → Install via YAML.
#
# NIE wklejaj tego pliku bezpośrednio. Wygeneruj gotową wersję z sekretami:
#   python3 scripts/render-truenas-compose.py
# (patrz DEPLOY_TRUENAS.md). Skrypt wypełnia placeholdery w podwójnych podkreślnikach.
#
# Minimalny Supabase: tylko Postgres (supabase/postgres) i Auth (GoTrue), bez Studio/Kong.
#
#   cloudflared ─tunnel─▶ web (nginx) ─frontend─▶ api (FastAPI) ─backend─▶ db
#                          └──── /supabase-auth/verify ──▶ auth (GoTrue) ─▶ db, SMTP Resend

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: "5432"
      PGPORT: "5432"
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: "__POSTGRES_PASSWORD__"
      PGPASSWORD: "__POSTGRES_PASSWORD__"
      JWT_EXP: "3600"
    volumes:
      # Pusty dataset przy pierwszym starcie; potem trzyma całą bazę (snapshoty ZFS!).
      - __DATA_DIR__/db:/var/lib/postgresql/data
      # Wolumen nazwany, nie host path: Docker kopiuje do niego przy pierwszym starcie pliki
      # dołączane przez postgresql.conf obrazu (pusty bind mount = baza nie wystartuje).
      # Trzyma też klucz pgsodium — nie usuwaj go razem z aplikacją.
      - db-config:/etc/postgresql-custom
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Migracje aplikacji i hasła ról. Kończy się po kilku sekundach przy każdym starcie.
  migrate:
    image: ghcr.io/git-jacob-bit/webownik-migrate:__IMAGE_TAG__
    pull_policy: always
    restart: "no"
    environment:
      POSTGRES_PASSWORD: "__POSTGRES_PASSWORD__"
      APP_DB_PASSWORD: "__APP_DB_PASSWORD__"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  auth:
    image: supabase/gotrue:v2.196.0
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: https://__DOMAIN__/supabase-auth
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:__POSTGRES_PASSWORD__@db:5432/postgres
      GOTRUE_SITE_URL: https://__DOMAIN__
      GOTRUE_URI_ALLOW_LIST: https://__DOMAIN__/email-confirmed,https://__DOMAIN__/reset-password
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: "__JWT_SECRET__"
      GOTRUE_JWT_ISSUER: https://__DOMAIN__/supabase-auth
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_PASSWORD_REQUIRED_CHARACTERS: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789"
      # Wszystkie żądania logowania przychodzą z kontenera api (jeden adres IP), więc limit
      # GoTrue „na IP” jest w praktyce globalny. Limity per użytkownik/IP robi FastAPI.
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: "1800"
      # Resend przez SMTP (domena czech-net.com zweryfikowana w Resend).
      GOTRUE_SMTP_HOST: smtp.resend.com
      GOTRUE_SMTP_PORT: "587"
      GOTRUE_SMTP_USER: resend
      GOTRUE_SMTP_PASS: "__RESEND_API_KEY__"
      GOTRUE_SMTP_ADMIN_EMAIL: __MAIL_FROM__
      GOTRUE_SMTP_SENDER_NAME: Webownik
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      # Bezwzględna ścieżka zastępuje ścieżkę API_EXTERNAL_URL (url.ResolveReference),
      # więc link w mailu to https://__DOMAIN__/supabase-auth/verify?...
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /supabase-auth/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /supabase-auth/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /supabase-auth/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /supabase-auth/verify
      # Szablony serwuje kontener web w sieci wewnętrznej (bez zależności od tunelu).
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://web:8080/email-templates/confirmation.html
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Potwierdź konto w Webowniku / Confirm your Webownik account
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://web:8080/email-templates/recovery.html
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Reset hasła w Webowniku / Reset your Webownik password
    networks: [backend, frontend]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 6

  api:
    image: ghcr.io/git-jacob-bit/webownik-api:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DOMAIN: https://__DOMAIN__
      CORS_ORIGINS: https://__DOMAIN__
      ALLOWED_HOSTS: __DOMAIN__,127.0.0.1
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict
      TRUSTED_PROXY_CIDRS: __INTERNAL_SUBNET__
      DATABASE_URL: postgresql://webownik_app:__APP_DB_PASSWORD__@db:5432/postgres
      SUPABASE_AUTH_URL: http://auth:9999
      SUPABASE_PUBLISHABLE_KEY: "__ANON_KEY__"
      SUPABASE_SECRET_KEY: "__SERVICE_ROLE_KEY__"
      TURNSTILE_SECRET_KEY: "__TURNSTILE_SECRET_KEY__"
      GITHUB_REPOSITORY: Git-Jacob-bit/webownik_again
      GITHUB_TOKEN: "__GITHUB_TOKEN__"
    networks:
      backend: {}
      frontend:
        # Alias istnieje tylko w sieci frontend: nginx łączy się zawsze przez nią,
        # a API ufa CF-Connecting-IP wyłącznie z tej podsieci.
        aliases: [webownik-api]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1536m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/git-jacob-bit/webownik-web:__IMAGE_TAG__
    pull_policy: always
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [frontend, tunnel]
    init: true
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Osobny tunel tylko dla Webownika (Public Hostname: __DOMAIN__ → HTTP web:8080).
      TUNNEL_TOKEN: "__TUNNEL_TOKEN__"
    depends_on:
      web:
        condition: service_healthy
    networks: [tunnel]
    security_opt: ["no-new-privileges:true"]

volumes:
  db-config: {}

networks:
  # db, migrate, auth, api — z dostępem do Internetu (SMTP Resend, Turnstile, GitHub).
  backend: {}
  # web ↔ api/auth. Bez wyjścia do Internetu, stała podsieć dla TRUSTED_PROXY_CIDRS.
  frontend:
    internal: true
    ipam:
      config:
        - subnet: __INTERNAL_SUBNET__
  # web ↔ cloudflared.
  tunnel: {}
