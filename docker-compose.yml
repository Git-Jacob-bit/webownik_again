services:
  api:
    build: ./backend
    container_name: nauka_backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    extra_hosts:
      # Na Linuksie host.docker.internal nie istnieje domyślnie (Supabase CLI działa na hoście).
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: nauka_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8000
