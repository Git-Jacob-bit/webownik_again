services:
  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    restart: unless-stopped
    init: true
    networks:
      - internal
      - supabase
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    pids_limit: 256
    mem_limit: 1536m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - tunnel
      - supabase
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5000}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    internal: true
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_default}
  tunnel:
    external: true
    name: ${CLOUDFLARE_NETWORK:-cloudflare_default}
