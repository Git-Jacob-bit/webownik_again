services:
  api:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    restart: unless-stopped
    networks:
      - internal
      - supabase
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - internal
      - tunnel
      - supabase
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-5000}:80"
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    internal: true
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-supabase_default}
  tunnel:
    external: true
    name: ${CLOUDFLARE_NETWORK:-cloudflare_default}
